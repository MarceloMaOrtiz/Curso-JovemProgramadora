<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Exemplos de Formulário</title>
    <link href="style.css" rel="stylesheet" />
</head>
<body>
    <form action="" method="post">
        <label for="nome">Nome: </label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required maxlength="100"/>
        <label for="pw">Senha: </label>
        <input type="password" name="senha" id="pw" placeholder="Digite sua senha" required/>
        <br />
        <input type="radio" name="sexo" value="M" required/>Masculino
        <input type="radio" name="sexo" value="F" required/>Feminino
        <br />
        <label>Idiomas: </label><br />
        <input type="checkbox" name="idiomas" value="pt" />Português
        <input type="checkbox" name="idiomas" value="en" />Inglês
        <input type="checkbox" name="idiomas" value="es" />Espanhol
        <input type="checkbox" name="idiomas" value="fr" />Francês
        <input type="checkbox" name="idiomas" value="de" />Alemão
        <input type="checkbox" name="idiomas" value="jp" />Mandarim
        <br />
        <label for="email">E-mail: </label>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail">
        <label for="dt_nasc">Data Nascimento: </label>
        <input type="date" name="dt_nasc" id="dt_nasc"/>
        <br />
        <label for="fruta">Fruta Preferida</label>
        <select id="fruta" name="fruta">
            <option value="abacate">Abacate</option>
            <option value="abacaxi">Abacaxi</option>
            <option value="acerola">Acerola</option>
            <option value="ameixa">Ameixa</option>
            <option value="banana">Banana</option>
            <option value="carambola">Carambola</option>
            <option value="caju">Caju</option>
            <option value="cereja">Cereja</option>
            <option value="coco">Coco</option>
            <option value="cupuaçu">Cupuaçu</option>
            <option value="framboesa">Framboesa</option>
            <option value="goiaba" selected>Goiaba</option>
            <option value="graviola">Graviola</option>
            <option value="jabuticaba">Jabuticaba</option>
            <option value="kiwi">Kiwi</option>
            <option value="laranja">Laranja</option>
            <option value="maca">Maçã</option>
            <option value="manga">Manga</option>
            <option value="maracuja">Maracujá</option>
            <option value="mirtilo">Mirtilo</option>
            <option value="morango">Morango</option>
            <option value="pera">Pera</option>
            <option value="pessego">Pêssego</option>
            <option value="pitanga">Pitanga</option>
            <option value="tangerina">Tangerina</option>
        </select>
        <br />
        <label for="bio">Fale sobre você: </label>
        <br />
        <textarea name="bio" id="bio" placeholder="Fale sobre sua alma" rows="4" cols="60"></textarea>
        <br />

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <button type="button" onclick="alert('Perigo!!')">Clique Aqui</button>
    </form>
</body>
</html>
