<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Cadastrar Aluno</title>
    <link href="../style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Quintessential&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Cadastrar Aluno</h1>

    <div class="caixa-cadastro">
        <form id="formCadastro">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required />
            </div>

            <div class="campo">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required />
            </div>

            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required />
            </div>

            <div class="campo">
                <label for="media">Média:</label>
                <input type="number" id="media" name="media" step="0.01" required />
            </div>

            <br />
            <button type="submit" class="button">Cadastrar</button>
        </form>
    </div>

    <script src="../js/cadastro_aluno.js"></script>
</body>
</html>
