<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Buscar Aluno</title>
    <link href="style.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Quintessential&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Buscar Aluno</h1>

    <div class="caixa-cadastro">
        <form>

            <div class="campo">
                <label for="cpf">Digite o CPF para buscar o aluno:</label>
                <input type="number" id="cpf" name="cpf" step="0.01" required />
            </div>
            <br />
            <button type="submit" class="button">Buscar</button>
        </form>
    </div>
</body>
</html>
