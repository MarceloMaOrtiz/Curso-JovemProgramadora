<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Buscar Aluno</title>
    <link href="../style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&family=Quintessential&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Buscar Aluno</h1>

    <div class="caixa-cadastro">
        <form id="formBusca">
            <div class="campo">
                <label for="cpf">Digite o CPF para buscar o aluno:</label>
                <input type="text" id="cpf" name="cpf" required />
            </div>
            <br />
            <button type="submit" class="button">Buscar</button>
        </form>
    </div>

    <table class="table" id="tabela" style="width:100%">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Data de Nascimento</th>
                <th>CPF</th>
                <th>Média</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="../js/buscar_aluno.js"></script>
</body>
</html>
